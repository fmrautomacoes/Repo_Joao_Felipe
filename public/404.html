<script>
/* Corrige endereços digitados com maiúsculas ou espaços (comum no celular), ex.: /Admin -> /admin */
(function () {
  try {
    var p = decodeURIComponent(location.pathname).trim().toLowerCase().replace(/\s+/g, "");
    if (p !== location.pathname) location.replace(p + location.search + location.hash);
  } catch (e) {}
})();
</script>
